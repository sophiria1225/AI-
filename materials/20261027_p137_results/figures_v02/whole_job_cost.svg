  <g id="text_30">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle" x="540" y="38.0775" transform="rotate(-0 540 38.0775)">P137 — Whole-job cost and official outcome</text>
  </g>
  <g id="text_31">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="75.6" y="74.52" transform="rotate(-0 75.6 74.52)">All 4 new slots: seed57 fields is unpaired; seed157 has 3 modes. No P136 outcomes or costs are pooled.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(75.6 552.36)">Adoption gate (not evaluated): False. Negative differences mean fewer tokens, not automatically better quality.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(75.6 567.36)">Hatching = known subtotal plus unmeasured usage; × = usage unmeasured. No condition is omitted. Cached input is not subtracted.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(75.6 582.36)">Both comparison rows use seed157 only. Common-success costs exclude gains, losses and both-failed pairs.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(75.6 597.36)">Comparison-table 'unmeasured' also includes conservative descriptive null aggregates with some known components.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(75.6 612.36)">Seed157 is one descriptive pair; seed57 is unpaired. Unbalanced policy totals are not an effect comparison.</text>
  </g>
 </g>

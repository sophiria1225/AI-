<svg viewBox="0 0 1120 380" role="img" aria-label="品質を保って総費用を下げる研究目標。実測値を示すグラフではない" xmlns="http://www.w3.org/2000/svg"><defs><marker id="story-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#167a78"/></marker></defs><text x="15" y="25" font-size="21" fill="#596c79" text-anchor="start" font-weight="500">目標を表す概念図・実測ではない</text><path d="M140 310 H1050 M140 310 V60" fill="none" stroke="#596c79" stroke-width="2"/><text x="20" y="99" font-size="24" fill="#172c43" text-anchor="start" font-weight="700">性能</text><text x="20" y="132" font-size="19" fill="#596c79" text-anchor="start" font-weight="500">高い</text><text x="670" y="352" font-size="24" fill="#172c43" text-anchor="start" font-weight="700">仕事全体の費用 →</text><line x1="150" y1="133" x2="1045" y2="133" stroke="#91a0aa" stroke-width="2" stroke-dasharray="7 7"/><circle cx="910" cy="133" r="12" fill="#596c79"/><text x="910" y="102" font-size="24" fill="#596c79" text-anchor="middle" font-weight="700">基準方式</text><circle cx="400" cy="133" r="14" fill="#167a78"/><text x="400" y="102" font-size="25" fill="#167a78" text-anchor="middle" font-weight="700">目指す位置</text><path d="M873 133 L435 133" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><text x="655" y="182" font-size="24" fill="#167a78" text-anchor="middle" font-weight="700">性能を保ちながら費用を減らす</text><text x="205" y="250" font-size="22" fill="#172c43" text-anchor="start" font-weight="500">性能：要求を満たす完了率・成果物の正しさ</text><text x="205" y="287" font-size="22" fill="#172c43" text-anchor="start" font-weight="500">費用：全AIトークンを主指標、操作回数・時間も記録</text></svg>

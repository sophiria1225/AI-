<svg viewBox="0 0 1120 365" role="img" aria-label="写真整理の四工程と、それをつなぐ情報" xmlns="http://www.w3.org/2000/svg"><defs><marker id="story-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#167a78"/></marker></defs><text x="10" y="28" font-size="25" fill="#172c43" text-anchor="start" font-weight="700">例：写真を撮影日ごとのフォルダーへ整理する</text><rect x="55" y="82" width="83" height="75" rx="5" fill="#e0ebe5" stroke="#167a78" stroke-width="2"/><path d="M64 145 l23-29 16 19 13-14 14 24" fill="none" stroke="#167a78" stroke-width="2"/><rect x="85" y="82" width="83" height="75" rx="5" fill="#e0ebe5" stroke="#167a78" stroke-width="2"/><path d="M94 145 l23-29 16 19 13-14 14 24" fill="none" stroke="#167a78" stroke-width="2"/><rect x="115" y="82" width="83" height="75" rx="5" fill="#e0ebe5" stroke="#167a78" stroke-width="2"/><path d="M124 145 l23-29 16 19 13-14 14 24" fill="none" stroke="#167a78" stroke-width="2"/><text x="133" y="237" font-size="26" fill="#172c43" text-anchor="middle" font-weight="700">一覧を取得</text><text x="133" y="275" font-size="21" fill="#596c79" text-anchor="middle" font-weight="500">何が対象か</text><path d="M235 129 L308 129" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><rect x="340" y="82" width="83" height="75" rx="5" fill="#e0ebe5" stroke="#167a78" stroke-width="2"/><path d="M349 145 l23-29 16 19 13-14 14 24" fill="none" stroke="#167a78" stroke-width="2"/><rect x="370" y="82" width="83" height="75" rx="5" fill="#e0ebe5" stroke="#167a78" stroke-width="2"/><path d="M379 145 l23-29 16 19 13-14 14 24" fill="none" stroke="#167a78" stroke-width="2"/><rect x="400" y="82" width="83" height="75" rx="5" fill="#e0ebe5" stroke="#167a78" stroke-width="2"/><path d="M409 145 l23-29 16 19 13-14 14 24" fill="none" stroke="#167a78" stroke-width="2"/><text x="411" y="189" font-size="19" fill="#167a78" text-anchor="middle" font-weight="500">日付 → 移動先</text><text x="418" y="237" font-size="26" fill="#172c43" text-anchor="middle" font-weight="700">撮影日を確認</text><text x="418" y="275" font-size="21" fill="#596c79" text-anchor="middle" font-weight="500">どこへ移すか</text><path d="M520 129 L593 129" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><path d="M624 94 h55 l12 13 h97 v74 h-164z" fill="#e0ebe5" stroke="#167a78" stroke-width="3"/><text x="705" y="151" font-size="25" fill="#167a78" text-anchor="middle" font-weight="700">移動先</text><text x="703" y="237" font-size="26" fill="#172c43" text-anchor="middle" font-weight="700">写真を移動</text><text x="703" y="275" font-size="21" fill="#596c79" text-anchor="middle" font-weight="500">実際に変更</text><path d="M805 129 L878 129" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><path d="M909 94 h55 l12 13 h97 v74 h-164z" fill="#e0ebe5" stroke="#167a78" stroke-width="3"/><text x="990" y="151" font-size="25" fill="#167a78" text-anchor="middle" font-weight="700">✓</text><text x="988" y="237" font-size="26" fill="#172c43" text-anchor="middle" font-weight="700">完了を確認</text><text x="988" y="275" font-size="21" fill="#596c79" text-anchor="middle" font-weight="500">要求を満たしたか</text><text x="10" y="335" font-size="24" fill="#172c43" text-anchor="start" font-weight="700">この間に、取得した値・判断・操作済みの内容をつなぐ必要がある。</text></svg>

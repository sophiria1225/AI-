<svg role="img" aria-label="LLMとツールと状態を接続するハーネスの循環" viewBox="0 0 1120 435" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#167a78"/></marker></defs><defs><marker id="flowarrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="18" refX="10" refY="4" viewBox="0 0 10 8" orient="auto"><path d="M0 0L10 4L0 8" fill="#167a78"/></marker></defs><path d="M275 92 C470 4 699 4 845 92" fill="none" stroke="#167a78" stroke-width="5" marker-end="url(#flowarrow)"/><path d="M976 120 C1130 220 890 410 620 315" fill="none" stroke="#167a78" stroke-width="5" marker-end="url(#flowarrow)"/><path d="M480 315 C230 415 25 260 150 120" fill="none" stroke="#167a78" stroke-width="5" marker-end="url(#flowarrow)"/><circle cx="220" cy="120" r="66" fill="#e8eee7" stroke="none" stroke-width="3"/><text x="220" y="129" font-size="27" fill="#172c43" font-weight="700" text-anchor="middle">LLM</text><text x="220" y="220" font-size="21" fill="#172c43" font-weight="500" text-anchor="middle">次に何をするか</text><circle cx="910" cy="120" r="66" fill="#e8eee7" stroke="none" stroke-width="3"/><text x="910" y="129" font-size="27" fill="#172c43" font-weight="700" text-anchor="middle">ツール</text><text x="910" y="220" font-size="21" fill="#172c43" font-weight="500" text-anchor="middle">読取・計算・変更</text><circle cx="550" cy="302" r="66" fill="#e8eee7" stroke="none" stroke-width="3"/><text x="550" y="311" font-size="27" fill="#172c43" font-weight="700" text-anchor="middle">状態・履歴</text><text x="550" y="402" font-size="21" fill="#172c43" font-weight="500" text-anchor="middle">何が分かり、何が終わったか</text><text x="558" y="119" font-size="28" fill="#172c43" font-weight="700" text-anchor="middle">ハーネスが制御する範囲</text><text x="558" y="164" font-size="21" fill="#172c43" font-weight="500" text-anchor="middle">入力の構成・操作・状態保存・検証・停止</text></svg>

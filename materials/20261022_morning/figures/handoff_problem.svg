<svg viewBox="0 0 1120 350" role="img" aria-label="値の保持と作業意図の引き継ぎは別という問題の説明例" xmlns="http://www.w3.org/2000/svg"><defs><marker id="story-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#167a78"/></marker></defs><text x="10" y="27" font-size="23" fill="#596c79" text-anchor="start" font-weight="500">説明用の場面：途中で会話履歴を短くして再開する</text><path d="M20 70h470v125H65l-30 25v-25H20z" fill="#e0ebe5"/><text x="45" y="110" font-size="24" fill="#172c43" text-anchor="start" font-weight="500">「一覧を取得した。撮影日で分類した。</text><text x="45" y="151" font-size="24" fill="#172c43" text-anchor="start" font-weight="500">次は、未処理の写真を移動する」</text><path d="M510 130 L595 130" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><path d="M620 70h480v125H665l-30 25v-25h-15z" fill="#eee1d7"/><text x="645" y="110" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">再開したAIに見えるのは直近の結果だけ</text><text x="645" y="151" font-size="24" fill="#c95c33" text-anchor="start" font-weight="700">「残っている一覧は何に使うもの？」</text><text x="20" y="274" font-size="29" fill="#167a78" text-anchor="start" font-weight="700">値が残ること</text><text x="270" y="274" font-size="36" fill="#596c79" text-anchor="start" font-weight="500">≠</text><text x="350" y="274" font-size="29" fill="#c95c33" text-anchor="start" font-weight="700">用途・作業の続きが伝わること</text><text x="20" y="326" font-size="22" fill="#172c43" text-anchor="start" font-weight="500">想定される支障：調べ直す／計算し直す／処理を抜かす／重複して処理する</text></svg>

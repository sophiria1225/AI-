<svg viewBox="0 0 1120 380" role="img" aria-label="取得・共有・AI呼び出し・実行・検証で生じ得る余分な費用" xmlns="http://www.w3.org/2000/svg"><defs><marker id="story-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#167a78"/></marker></defs><text x="15" y="27" font-size="23" fill="#596c79" text-anchor="start" font-weight="500">費用が積み上がる経路の例（研究する問題の模式図）</text><circle cx="110" cy="118" r="40" fill="#e0ebe5"/><text x="110" y="127" font-size="28" fill="#167a78" text-anchor="middle" font-weight="700">1</text><text x="110" y="196" font-size="25" fill="#172c43" text-anchor="middle" font-weight="700">情報取得</text><text x="110" y="235" font-size="20" fill="#596c79" text-anchor="middle" font-weight="500">検索・API</text><text x="110" y="295" font-size="21" fill="#c95c33" text-anchor="middle" font-weight="500">同じ結果を再取得</text><path d="M158 118 L287 118" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><circle cx="335" cy="118" r="40" fill="#e0ebe5"/><text x="335" y="127" font-size="28" fill="#167a78" text-anchor="middle" font-weight="700">2</text><text x="335" y="196" font-size="25" fill="#172c43" text-anchor="middle" font-weight="700">情報共有</text><text x="335" y="235" font-size="20" fill="#596c79" text-anchor="middle" font-weight="500">履歴・担当間通信</text><text x="335" y="295" font-size="21" fill="#c95c33" text-anchor="middle" font-weight="500">不要な情報も入力</text><path d="M383 118 L512 118" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><circle cx="560" cy="118" r="40" fill="#e0ebe5"/><text x="560" y="127" font-size="28" fill="#167a78" text-anchor="middle" font-weight="700">3</text><text x="560" y="196" font-size="25" fill="#172c43" text-anchor="middle" font-weight="700">AI呼び出し</text><text x="560" y="235" font-size="20" fill="#596c79" text-anchor="middle" font-weight="500">判断・担当への依頼</text><text x="560" y="295" font-size="21" fill="#c95c33" text-anchor="middle" font-weight="500">同じ判断を反復</text><path d="M608 118 L737 118" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><circle cx="785" cy="118" r="40" fill="#e0ebe5"/><text x="785" y="127" font-size="28" fill="#167a78" text-anchor="middle" font-weight="700">4</text><text x="785" y="196" font-size="25" fill="#172c43" text-anchor="middle" font-weight="700">実行</text><text x="785" y="235" font-size="20" fill="#596c79" text-anchor="middle" font-weight="500">計算・操作</text><text x="785" y="295" font-size="21" fill="#c95c33" text-anchor="middle" font-weight="500">済んだ処理を再実行</text><path d="M833 118 L962 118" fill="none" stroke="#167a78" stroke-width="3" marker-end="url(#story-arrow)"/><circle cx="1010" cy="118" r="40" fill="#e0ebe5"/><text x="1010" y="127" font-size="28" fill="#167a78" text-anchor="middle" font-weight="700">5</text><text x="1010" y="196" font-size="25" fill="#172c43" text-anchor="middle" font-weight="700">検証・停止</text><text x="1010" y="235" font-size="20" fill="#596c79" text-anchor="middle" font-weight="500">確認・修正</text><text x="1010" y="295" font-size="21" fill="#c95c33" text-anchor="middle" font-weight="500">不要な追加確認</text><text x="15" y="352" font-size="22" fill="#172c43" text-anchor="start" font-weight="700">減らしたいのは、成果に必要な処理を除いた余分な費用。必要性の判定が研究課題。</text></svg>

<svg viewBox="0 0 1120 360" role="img" aria-label="会話履歴、Python変数、アプリの状態の区別" xmlns="http://www.w3.org/2000/svg"><defs><marker id="story-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#167a78"/></marker></defs><text x="15" y="35" font-size="27" fill="#167a78" text-anchor="start" font-weight="700">① 会話履歴</text><line x1="15" y1="58" x2="335" y2="58" stroke="#167a78" stroke-width="4"/><text x="400" y="35" font-size="27" fill="#167a78" text-anchor="start" font-weight="700">② Pythonの変数</text><line x1="400" y1="58" x2="720" y2="58" stroke="#167a78" stroke-width="4"/><text x="785" y="35" font-size="27" fill="#596c79" text-anchor="start" font-weight="700">③ アプリの状態</text><line x1="785" y1="58" x2="1105" y2="58" stroke="#596c79" stroke-width="4"/><text x="15" y="105" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">AIの過去の応答</text><text x="15" y="150" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">ツールが返した結果</text><text x="15" y="195" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">次の入力としてAIに見せる</text><text x="400" y="105" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">取得した一覧や計算結果</text><text x="400" y="150" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">実行環境にある値</text><text x="400" y="195" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">コードで再利用できる</text><text x="785" y="105" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">移動済みのファイル</text><text x="785" y="150" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">送信済みの依頼や返金</text><text x="785" y="195" font-size="23" fill="#172c43" text-anchor="start" font-weight="500">すでに実行した操作の結果</text><text x="15" y="274" font-size="22" fill="#167a78" text-anchor="start" font-weight="700">今回、全部／直近に変える</text><text x="400" y="274" font-size="22" fill="#167a78" text-anchor="start" font-weight="700">今回、保持／初期化に変える</text><text x="785" y="274" font-size="22" fill="#596c79" text-anchor="start" font-weight="700">全条件で同じ状態から開始</text><text x="15" y="335" font-size="25" fill="#172c43" text-anchor="start" font-weight="700">変数を消しても、すでに移動した写真は元に戻さない。</text></svg>

   <text style="font-weight: 600; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle" x="482.4" y="28.469344" transform="rotate(-0 482.4 28.469344)">P123 — Whole-job logical tokens and task outcomes</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #424b54" x="482.4" y="41.472" transform="rotate(-0 482.4 41.472)">All 4 development tasks × all 3 methods; no outcome-based selection</text>
  </g>
  <g id="text_29">
   <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #424b54" transform="translate(72.36 470.031656)">Tokens include task, summary, failure, and recovery work. Bars show the recorded known subtotal; incomplete usage is never an exact total.</text>
   <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #424b54" transform="translate(72.36 483.081656)">Outcome labels are audited official results. Lower tokens on a failed task do not establish a quality-preserving saving.</text>
   <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #424b54" transform="translate(72.36 496.131656)">One fixed development run per task and method; no uncertainty interval, general quality guarantee, or novelty claim.</text>
  </g>

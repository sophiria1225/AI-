  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 432.672)">Actual skips are new-policy rejections before dispatch; baseline shadow rejects are hypothetical.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 447.672)">Both arms share existing budget screens and the first summary. Unknown usage is additional unmeasured cost.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 462.672)">Input savings, observed time and this forecast do not establish semantic fidelity or technical novelty.</text>

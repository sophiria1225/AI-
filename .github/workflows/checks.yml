name: Lightweight research checks
on: [push, pull_request]
jobs:
  accounting-and-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: SWE-agent/mini-swe-agent
          ref: 04d809ceab9df28f9adaed044884180159172930
          path: vendor/mini-swe-agent
          persist-credentials: false
      - run: python -m pip install -r requirements-ci.lock.txt
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_tracking.py
      - run: git diff --exit-code -- docs/task_board.md
